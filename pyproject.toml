
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrix-cli"
version = "0.1.0"
description = "Local-first security posture analysis CLI"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15,<1.0",
    "rich>=13.9,<15.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
sentrix = "sentrix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
